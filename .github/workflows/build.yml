# Сборка на чистой машине: библиотека, исполняемые цели, тестовая цель и
# примеры из docs/*.md (Scripts/check_docs.sh). Тесты здесь НЕ запускаются:
# на виртуальных macOS-машинах GitHub нет доступа к Metal, а каждый тест
# считает на GPU (mlx-swift по той же причине гоняет тесты на своих машинах).
# Полный прогон — `swift test` на Apple Silicon; без фикстур .testdata
# тесты на настоящих моделях пропускаются, а не падают.
#
# Ошибки сборки выводятся аннотациями (::error::) — их видно на странице
# прогона без входа в журнал; версия Xcode и Swift — аннотацией-заметкой.
name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          swift --version
          echo "::notice::$(xcodebuild -version | head -1); $(swift --version 2>&1 | head -1)"
          xcodebuild -showComponent MetalToolchain || xcodebuild -downloadComponent MetalToolchain || true
      - name: Build (library, executables, tests)
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log || {
            # GitHub показывает не больше 10 аннотаций на шаг, поэтому все
            # ошибки — одной аннотацией, строки через %0A.
            msg=$(grep -E '^/.*error:' build.log | sed "s|$PWD/||" | sort -u | head -60 | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
            exit 1
          }
      - name: Documentation examples compile
        run: ./Scripts/check_docs.sh
